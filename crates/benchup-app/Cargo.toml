[package]
name = "benchup-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
openxr = ["dep:openxr", "dep:ash", "dep:wgpu", "dep:ron"]

[[example]]
name = "openxr_diagnostics"
required-features = ["openxr"]

[[example]]
name = "openxr_panel"
required-features = ["openxr"]

[[example]]
name = "openxr_editor"
required-features = ["openxr"]

[dependencies]
benchup-core = { path = "../benchup-core" }
serde.workspace = true
serde_json.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
skrifa = "0.44"
glam.workspace = true
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland", "accesskit", "persistence", "links"] }
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
zip = { version = "8", default-features = false }
rfd = { version = "0.17.2", features = ["file-handle-inner"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", features = ["webgpu", "webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Storage", "Blob", "BlobPropertyBag", "HtmlAnchorElement", "Url"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
openxr = { version = "=0.22.0", optional = true, default-features = false, features = ["loaded"] }
ash = { version = "=0.38.0", optional = true }
ron = { version = "=0.12.2", optional = true }
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["vulkan", "wgsl"] }
directories = "6"
tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ureq = "3.5"
tempfile = "3"
# Keep this in sync with the vpk tool in the desktop release workflow.
velopack = "=1.2.161"
rayon = "1.12"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "0.4"
png = "0.18"

[build-dependencies]
cc = "1"
